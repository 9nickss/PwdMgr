services:
  postgres:
    image: postgres:13
    container_name: securevault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: securevault
      POSTGRES_PASSWORD: securevault_pass
      POSTGRES_DB: securevault
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securevault -d securevault"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: securevault_backend
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: securevault
      PGPASSWORD: securevault_pass
      PGDATABASE: securevault
      JWT_SECRET: securevault-development-secret
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: securevault_frontend
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
